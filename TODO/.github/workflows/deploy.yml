# Deployment Workflow
# This workflow deploys the frontend to GitHub Pages
# Triggers after successful CI on main branch

name: Deploy to GitHub Pages

on:
  # Run after CI workflow completes successfully
  workflow_run:
    workflows: ["CI - Build and Test"]
    types:
      - completed
    branches: [main, master]

  # Allow manual trigger from Actions tab
  workflow_dispatch:

# Grant permissions to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one deployment at a time
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ============================================
  # JOB 1: Build Frontend for Deployment
  # ============================================
  build:
    name: Build for Deployment
    runs-on: ubuntu-latest

    # Only run if CI passed (or manual trigger)
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      # Step 1: Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ./todo_frontend/package-lock.json

      # Step 3: Install dependencies
      - name: Install Dependencies
        working-directory: ./todo_frontend
        run: npm ci --legacy-peer-deps || npm install

      # Step 4: Build for production
      - name: Build Application
        working-directory: ./todo_frontend
        run: npm run build
        env:
          CI: false
          PUBLIC_URL: /${{ github.event.repository.name }}
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL || 'http://localhost:5000' }}

      # Step 5: Setup GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # Step 6: Upload artifact for GitHub Pages
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./todo_frontend/build

  # ============================================
  # JOB 2: Deploy to GitHub Pages
  # ============================================
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment Complete
        run: |
          echo "============================================"
          echo "🚀 DEPLOYMENT SUCCESSFUL!"
          echo "============================================"
          echo "Your app is live at: ${{ steps.deployment.outputs.page_url }}"
          echo "============================================"

  # ============================================
  # JOB 3: Notify on Failure
  # ============================================
  notify-failure:
    name: Notify on CI Failure
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}

    steps:
      - name: CI Failed
        run: |
          echo "============================================"
          echo "❌ CI WORKFLOW FAILED"
          echo "============================================"
          echo "Deployment skipped because CI failed."
          echo "Please check the CI workflow logs."
          echo "============================================"
          exit 1
