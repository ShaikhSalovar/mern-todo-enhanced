# Continuous Integration Workflow
# This workflow runs on every push to main branch
# It builds and tests both frontend and backend

name: CI - Build and Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ============================================
  # JOB 1: Build and Test Backend
  # ============================================
  backend:
    name: Backend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./todo_backend

    steps:
      # Step 1: Checkout code from repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ./todo_backend/package-lock.json

      # Step 3: Install dependencies
      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install

      # Step 4: Check for syntax errors
      - name: Check Syntax
        run: node --check server.js || echo "Syntax check completed"

      # Step 5: Display success message
      - name: Backend Build Complete
        run: echo "✅ Backend build completed successfully!"

  # ============================================
  # JOB 2: Build and Test Frontend
  # ============================================
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./todo_frontend

    steps:
      # Step 1: Checkout code from repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ./todo_frontend/package-lock.json

      # Step 3: Install dependencies
      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install

      # Step 4: Build the React application
      - name: Build Application
        run: npm run build
        env:
          CI: false
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL || 'http://localhost:5000' }}

      # Step 5: Upload build artifacts
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: ./todo_frontend/build
          retention-days: 7

      # Step 6: Display success message
      - name: Frontend Build Complete
        run: echo "✅ Frontend build completed successfully!"

  # ============================================
  # JOB 3: Build Summary
  # ============================================
  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: All Builds Passed
        run: |
          echo "============================================"
          echo "🎉 ALL BUILDS COMPLETED SUCCESSFULLY!"
          echo "============================================"
          echo "✅ Backend: Passed"
          echo "✅ Frontend: Passed"
          echo "============================================"
