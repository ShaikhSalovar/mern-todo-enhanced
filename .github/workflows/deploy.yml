name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: TODO/todo_frontend/package-lock.json

      - name: Install dependencies
        working-directory: TODO/todo_frontend
        run: npm ci --legacy-peer-deps || npm install

      - name: Build
        working-directory: TODO/todo_frontend
        run: npm run build
        env:
          CI: false
          PUBLIC_URL: /mern-todo-enhanced
          REACT_APP_API_URL: https://mern-todo-enhanced.onrender.com

      - name: Fix SPA routing
        run: cp TODO/todo_frontend/build/index.html TODO/todo_frontend/build/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: TODO/todo_frontend/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
